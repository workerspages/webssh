version: '3.8'

services:
  webssh:
    image: ghcr.io/workerspages/webssh:main-mariadb-tailscale
    container_name: webssh
    ports:
      - "8888:8888"
    environment:
      # 管理员账号配置
      - USER=admin
      - PASS=admin123
      - TZ=Asia/Shanghai
      
      # ----------- 外部数据库配置 -----------
      - DB_TYPE=mariadb           # 或 mysql
      - DB_HOST=192.168.1.100     # 【重点】修改为您外部数据库的真实 IP 或域名
      - DB_PORT=3306              # 数据库端口
      - DB_USER=root              # 数据库用户名
      - DB_PASS=your_db_password  # 数据库密码
      - DB_NAME=webssh            # 数据库库名 (请确保该库已存在)
      # - DB_TLS=true              # TLS 加密连接 (TiDB Cloud 必须设为 true)
      # ------------------------------------
      
      # ----------- Tailscale 配置 (可选) -----------
      # - TS_AUTHKEY=tskey-auth-xxxxx  # Tailscale Auth Key (设置后自动启用)
      # - TS_HOSTNAME=webssh           # Tailscale 网络中的主机名

      # 如果不加这一行，WebSSH 启动时会默认尝试以“个人设备”身份注册，但你的 Key 只有“服务器 Tag”的权限，可能会导致权限不匹配而报错。加上这行就万无一失了。
      # - TS_EXTRA_ARGS=--advertise-tags=tag:webssh
      # ---------------------------------------------
      
    volumes:
      - ./data:/app/data          # 即使使用 MySQL，建议挂载 data 目录以保存日志文件等
    restart: unless-stopped
